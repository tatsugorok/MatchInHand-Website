</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to contact</a>
  <header class="site-header">
    <a class="wordmark wordmark-match" href="../" aria-label="Match In Hand home"><span>MATCH</span><i>in</i><span>HAND</span></a>
    <nav aria-label="Primary navigation">
      <a href="../#quick-start">Quick start</a>
      <a href="../#setup">Setup</a>
      <a href="../#turns">How to play</a>
      <a href="../#cards">Cards</a>
      <a href="./" aria-current="page">Contact</a>
    </nav>
    <label class="language-picker"><span class="sr-only">Language</span><select data-language-select aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="es">ES</option><option value="it">IT</option><option value="de">DE</option><option value="ja">日本語</option></select></label>
    <a class="header-cta" href="../assets/MatchInHand_RulesSheet_v2.3.pdf" download>Rulebook PDF</a>
  </header>
  <main class="contact-main" id="main">
    <section class="contact-intro">
      <div class="contact-copy">
        <p class="eyebrow">Get in touch</p>
        <h1>Contact</h1>
        <p>Questions about the game, rules or partnerships? Send a message to TJL Studio.</p>
      </div>
      <div class="contact-panel">
        <h2>Send us a message</h2>
        <form class="contact-form" id="contact-form" action="https://formsubmit.co/Benoit.gille@tjl-studio.com" method="POST">
          <input type="hidden" name="_url" value="https://matchinhand.com/contact/">
          <input type="hidden" name="_subject" value="New Match In Hand website message">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="false">
          <input class="form-honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
          <label>Name *<input type="text" name="name" autocomplete="name" required></label>
          <label>Email address *<input type="email" name="email" autocomplete="email" required></label>
          <label>Message *<textarea name="message" required></textarea></label>
          <button class="button button-primary" type="submit">Send message</button>
          <p class="form-help">Your message will be sent directly to TJL Studio.</p>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
  <footer><a class="wordmark wordmark-match" href="../"><span>MATCH</span><i>in</i><span>HAND</span></a><span>© 2026 TJL Studio ltd.</span></footer>
